version: 2.1

references:
  iadvize-docker-credentials: &iadvize-docker-credentials
    auth:
      username: $DOCKER_USERNAME
      password: $DOCKER_PASSWORD


  filters-only-tag: &filters-only-tag
    tags:
      only: /.*/
    branches:
      ignore: /.*/
      
  filters-all-branches: &filters-all-branches
    tags:
      ignore: /.*/
    branches:
      only: /.*/

  filters-all-branches-and-tags: &filters-all-branches-and-tags
    branches:
      only: /.*/
    tags:
      only: /[0-9]+(\.[0-9]+)*/

  persist-workspace: &persist-workspace
    persist_to_workspace:
      root: ~/node
      paths:
        - boxed-tag

  restore-workspace: &restore-workspace
      attach_workspace:
        at: ~/node

defaults: &defaults
  working_directory: ~/node/boxed-tag

executors:
  nodejs:
    docker:
      - image: cimg/node:16.20
    working_directory: ~/node/boxed-tag
    environment:
      NODE_OPTIONS: --max_old_space_size=2048

  iadvize-docker:
    docker:
      - image: iadvize/builder:docker-17.06-git
        <<: *iadvize-docker-credentials

jobs:
  install:
    <<: *defaults
    executor: nodejs
    steps:
      - checkout
      - run:
          name: "npm ci"
          command: npm ci
      - *persist-workspace

  build:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run: npm run build
      - *persist-workspace


  test:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run:
          name: "Test JS"
          command: npm test

  lint:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run:
          name: "Lint JS"
          command: npm run lint


  upload-s3:
    <<: *defaults
    machine:
      image: ubuntu-2004:202201-02
    parameters:
      target_env:
        description: "Environment whose static files bucket to publish to"
        type: enum
        enum: ["dev", "prod"]
    steps:
      - *restore-workspace
      - run:
          name: "Publish the web bundle to S3 (<< parameters.target_env >>)"
          environment:
            TARGET_ENV: << parameters.target_env >>
          command: |
            if [ "$TARGET_ENV" = "prod" ]; then
              export AWS_ACCESS_KEY_ID=$PROD_STATIC_FILES_AWS_ACCESS_KEY_ID
              export AWS_SECRET_ACCESS_KEY=$PROD_STATIC_FILES_AWS_SECRET_ACCESS_KEY
            else
              export AWS_ACCESS_KEY_ID=$DEV_STATIC_FILES_AWS_ACCESS_KEY_ID
              export AWS_SECRET_ACCESS_KEY=$DEV_STATIC_FILES_AWS_SECRET_ACCESS_KEY
            fi
            .circleci/uploadS3.sh

workflows:
  version: 2
  build-test:
    jobs:
      - install:
          context: org-global
          filters:
            <<: *filters-all-branches

      - test:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - lint:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - build:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - upload-s3:
          name: upload-s3-dev
          target_env: dev
          context: org-global
          requires:
            - build
          filters:
            <<: *filters-all-branches
  upload:
    jobs:
      - install:
          context: org-global
          filters:
            <<: *filters-only-tag

      - build:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-only-tag

      - upload-s3:
          name: upload-s3-prod
          target_env: prod
          context: org-global
          requires:
            - build
          filters:
            <<: *filters-only-tag