version: 2.1

orbs:
  ci-cd: iadvize/ci-cd@volatile
  aws-cli: circleci/aws-cli@5.1.0

references:
  iadvize-docker-credentials: &iadvize-docker-credentials
    auth:
      username: $DOCKER_USERNAME
      password: $DOCKER_PASSWORD


  filters-only-tag: &filters-only-tag
    tags:
      only: /.*/
    branches:
      ignore: /.*/
      
  filters-all-branches: &filters-all-branches
    tags:
      ignore: /.*/
    branches:
      only: /.*/

  filters-all-branches-and-tags: &filters-all-branches-and-tags
    branches:
      only: /.*/
    tags:
      only: /[0-9]+(\.[0-9]+)*/

  persist-workspace: &persist-workspace
    persist_to_workspace:
      root: ~/node
      paths:
        - boxed-tag

  restore-workspace: &restore-workspace
      attach_workspace:
        at: ~/node

defaults: &defaults
  working_directory: ~/node/boxed-tag

executors:
  nodejs:
    docker:
      - image: cimg/node:16.20
    working_directory: ~/node/boxed-tag
    environment:
      NODE_OPTIONS: --max_old_space_size=2048

  iadvize-docker:
    docker:
      - image: iadvize/builder:docker-17.06-git
        <<: *iadvize-docker-credentials

jobs:
  install:
    <<: *defaults
    executor: nodejs
    steps:
      - checkout
      - run:
          name: "npm ci"
          command: npm ci
      - *persist-workspace

  build:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run: npm run build
      - *persist-workspace


  test:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run:
          name: "Test JS"
          command: npm test

  lint:
    <<: *defaults
    executor: nodejs
    steps:
      - *restore-workspace
      - run:
          name: "Lint JS"
          command: npm run lint


  upload-s3:
    <<: *defaults
    docker:
      - image: cimg/base:current
    resource_class: small
    parameters:
      target_env:
        description: "Environment whose static files bucket to publish to"
        type: enum
        enum: ["dev", "prod"]
      aws_access_key_id:
        type: env_var_name
      aws_secret_access_key:
        type: env_var_name
    steps:
      - *restore-workspace
      - run:
          name: "Read the version from package.json"
          command: |
            VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | awk '{$1=$1};1')
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - aws-cli/setup:
          aws_access_key_id: << parameters.aws_access_key_id >>
          aws_secret_access_key: << parameters.aws_secret_access_key >>
          region: eu-central-1
      - ci-cd/s3_sync:
          app_path: boxed-tag
          local_from: web
          remote_to: $VERSION
          target_env: << parameters.target_env >>

workflows:
  version: 2
  build-test:
    jobs:
      - install:
          context: org-global
          filters:
            <<: *filters-all-branches

      - test:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - lint:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - build:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-all-branches

      - upload-s3:
          name: upload-s3-dev
          target_env: dev
          aws_access_key_id: DEV_STATIC_FILES_AWS_ACCESS_KEY_ID
          aws_secret_access_key: DEV_STATIC_FILES_AWS_SECRET_ACCESS_KEY
          context: org-global
          requires:
            - build
          filters:
            <<: *filters-all-branches
  upload:
    jobs:
      - install:
          context: org-global
          filters:
            <<: *filters-only-tag

      - build:
          context: org-global
          requires:
            - install
          filters:
            <<: *filters-only-tag

      - upload-s3:
          name: upload-s3-prod
          target_env: prod
          aws_access_key_id: PROD_STATIC_FILES_AWS_ACCESS_KEY_ID
          aws_secret_access_key: PROD_STATIC_FILES_AWS_SECRET_ACCESS_KEY
          context: org-global
          requires:
            - build
          filters:
            <<: *filters-only-tag