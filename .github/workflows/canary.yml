name: Canary deployment

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  publish-canary:
    name: 'publish canary'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

    - name: Compute canary version
      id: compute-version
      env:
        ID: ${{ github.sha }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        NOW=$(date +%s%3N)

        CURRENT_VERSION=$(cat package.json | jq -r '.version')
        NEW_VERSION=$CURRENT_VERSION-canary-$COMMIT-$NOW

        NAME=$(cat package.json | jq -r '.name')

        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "name=$NAME" >> $GITHUB_OUTPUT

    - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        registry-url: https://registry.npmjs.org/
        node-version: '18.x'

    - name: Cache npm cache
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/.npm
        key: v1-npm-${{ github.rest.event.pull_request.head.ref }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v1-npm-${{ github.rest.event.pull_request.head.ref }}-
          v1-npm-

    - name: Install
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Bumb version
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        VERSION: ${{ steps.compute-version.outputs.version }}
      run: |
        npm version --no-git-tag-version $VERSION

    - name: Create deployment
      id: deployment
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
      env:
        NAME: ${{ steps.compute-version.outputs.name }}
        VERSION: ${{ steps.compute-version.outputs.version }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        previews: 'ant-man-preview,flash-preview'
        script: |
          const name = process.env.NAME;
          const version = process.env.VERSION;

          const branch = context.payload.pull_request.head.ref;

          const { data: deployment } = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: branch,
            environment: 'npm',
            auto_merge: false,
            required_contexts: [],
            payload: {
              version,
              name,
              ref: context.payload.pull_request.head.sha,
              npmTag: branch,
            },
            description: `Deploy ${name}@${version} on npm`,
            production_environment: true,
          });
